<style>
/* ===== 作品 chw_ ===== */

/* b 篩選＋作品牆 */
.chw_b{padding: calc(var(--pdy) * 1.1) var(--pdx) calc(var(--pdy) * 1.3);}
.chw_b01{max-width: 1400px;width: 100%;margin: auto;}
.chw_b01_head{display: flex;justify-content: space-between;align-items: flex-end;gap: 30px;flex-wrap: wrap;margin-bottom: 50px;}
.hs_box .chw_b01_head > p{max-width: 480px;color: var(--colorText-sub);}
.chw_filter{display: flex;align-items: center;justify-content: space-between;gap: 20px;flex-wrap: wrap;padding: 18px 0;margin-bottom: 50px;border-top: 1px solid var(--color-line) !important;border-bottom: 1px solid var(--color-line) !important;position: sticky;top: 0;z-index: 5;background: var(--color-bg);transition: top .6s var(--ease);}
body:has(.ch_header:not(.is-hidden).is-scrolled) .chw_filter{top: 74px;}
.chw_filter ul{display: flex;flex-wrap: wrap;gap: 8px;}
.chw_filter button{background: none;cursor: pointer;padding: 8px 18px;border-radius: 40px;border: 1px solid transparent !important;transition: border-color .3s, background-color .3s;}
.hs_box .chw_filter button span{font-family: var(--Seriffont);font-size: var(--f15);letter-spacing: .15em;transition: color .3s;}
.hs_box .chw_filter button sup{font-family: var(--Corfont);font-size: 13px;color: var(--color-Sub);margin-left: 4px;letter-spacing: 0;}
.chw_filter button:hover{border-color: var(--color-Sub) !important;}
.chw_filter button[aria-pressed="true"]{background: var(--color-dark);}
.hs_box .chw_filter button[aria-pressed="true"] span{color: var(--colorText-whi);}
.hs_box .chw_count{font-family: var(--Corfont);font-style: italic;font-size: var(--f18);color: var(--colorText-sub);}
.hs_box .chw_count b{font-family: var(--Corfont);font-size: var(--f26);color: var(--color-Sub);font-style: normal;}

/* 手機浮動篩選鈕＋底部分類面板（放在 hs_box 外，字體自行指定） */
.chw_fab{position: fixed;left: 50%;bottom: calc(20px + env(safe-area-inset-bottom));z-index: 85;display: none;align-items: center;gap: 10px;padding: 12px 22px;border: 0;border-radius: 40px;background: var(--color-dark);color: var(--colorText-whi);font-family: var(--Seriffont);font-size: 14px;letter-spacing: .12em;box-shadow: 0 12px 30px -10px rgba(0,0,0,.55);cursor: pointer;transform: translate(-50%, calc(100% + 60px));transition: transform .5s var(--ease);}
.chw_fab b{font-weight: 500;color: var(--color-Sub);}
.chw_fab i{width: 7px;height: 7px;border-right: 1px solid currentColor;border-bottom: 1px solid currentColor;transform: rotate(-135deg) translate(-2px, -2px);}
.chw_fab.is-show{transform: translate(-50%, 0);}
.chw_sheet{position: fixed;inset: 0;z-index: 150;visibility: hidden;transition: visibility 0s .5s;}
.chw_sheet.is-open{visibility: visible;transition: visibility 0s;}
.chw_sheet_bg{position: absolute;inset: 0;background: rgba(var(--rgb_dark),.55);opacity: 0;transition: opacity .4s;border: 0;padding: 0;width: 100%;cursor: pointer;}
.chw_sheet.is-open .chw_sheet_bg{opacity: 1;}
.chw_sheet_panel{position: absolute;left: 0;right: 0;bottom: 0;padding: 14px 20px calc(26px + env(safe-area-inset-bottom));background: var(--color-bg);border-radius: 18px 18px 0 0;transform: translateY(100%);transition: transform .5s var(--ease);}
.chw_sheet.is-open .chw_sheet_panel{transform: none;}
.chw_sheet_panel::before{content: '';display: block;width: 40px;height: 4px;border-radius: 4px;margin: 0 auto 16px;background: var(--color-line);}
.chw_sheet_panel p{margin: 0 0 14px;font-family: var(--Corfont);font-style: italic;font-size: 20px;color: var(--color-Sub);}
.chw_sheet_panel ul{display: grid;grid-template-columns: repeat(3, 1fr);gap: 8px;margin: 0;padding: 0;list-style: none;}
.chw_sheet_panel button{width: 100%;padding: 12px 4px;border: 1px solid var(--color-line);background: transparent;font-family: var(--Seriffont);font-size: 14px;letter-spacing: .1em;color: var(--colorText);cursor: pointer;}
.chw_sheet_panel button sup{font-family: var(--Corfont);font-size: 12px;color: var(--color-Sub);margin-left: 3px;}
.chw_sheet_panel button[aria-pressed="true"]{background: var(--color-dark);border-color: var(--color-dark);color: var(--colorText-whi);}

/* 瀑布流：每張圖照原比例 */
.chw_grid{columns: 3;column-gap: 36px;}
.chw_grid > li{display: block;break-inside: avoid;margin-bottom: 56px;}
.chw_grid > li.is-hide{display: none;}
.chw_grid[aria-busy="true"]{min-height: 60vh;}
.chw_grid > li.is-off{display: none;}
/* 分頁 */
.chw_pager{display: flex;justify-content: center;align-items: center;flex-wrap: wrap;gap: 10px;margin-top: 30px;padding-top: 40px;border-top: 1px solid var(--color-line) !important;}
.chw_pager button{min-width: 46px;height: 46px;padding: 0 6px;border-radius: 50%;border: 1px solid var(--color-line) !important;background: transparent;font-family: var(--Corfont);font-size: 18px;letter-spacing: .05em;color: var(--colorText);cursor: pointer;display: grid;place-items: center;transition: background-color .3s, color .3s, border-color .3s;}
.chw_pager button:hover:not(:disabled){border-color: var(--color-Sub) !important;color: var(--color-Sub);}
.chw_pager button[aria-current="page"]{background: var(--color-dark);border-color: var(--color-dark) !important;color: var(--colorText-whi);}
.chw_pager button:disabled{opacity: .3;cursor: default;}
.chw_pager .chw_pg_arw svg{width: 18px;height: 18px;}
.chw_grid > li.is-enter{animation: chw_in .7s var(--ease) both;animation-delay: calc(var(--n, 0) * 60ms);}
@keyframes chw_in{from{opacity: 0;transform: translateY(30px);}to{opacity: 1;transform: none;}}
.chw_grid button{display: block;width: 100%;text-align: left;background: none;cursor: zoom-in;}
.chw_grid figure{position: relative;}
.chw_grid figure::after{content: '+';position: absolute;right: 16px;bottom: 16px;width: 44px;height: 44px;border-radius: 50%;display: grid;place-items: center;background: rgba(245,240,232,.92);color: var(--colorText);font-family: var(--Corfont);font-size: 26px;line-height: 1;opacity: 0;transform: scale(.6);transition: opacity .4s, transform .5s var(--ease);}
.chw_grid button:is(:hover, :focus-visible) figure::after{opacity: 1;transform: none;}
.chw_grid button:is(:hover, :focus-visible) figure img{transform: scale(1.06);}
.hs_box .chw_grid button:hover h3{color: var(--color-Main);}
.chw_empty{display: none;text-align: center;padding: 80px 0;}

/* 燈箱 */
/* 燈箱：依照片方向切換版型（直圖左右並排、橫圖上下），手機全螢幕 */
.chw_lb{border: 0;padding: 0;margin: auto;width: fit-content;max-width: min(1280px, 94vw);max-height: 92vh;max-height: 92dvh;background: var(--color-bg);overflow: hidden;}
body:has(.chw_lb[open]){overflow: hidden;}
.chw_lb::backdrop{background: rgba(var(--rgb_dark),.85);-webkit-backdrop-filter: blur(4px);backdrop-filter: blur(4px);}
.chw_lb[open]{animation: chw_lb_in .5s var(--ease);}
@keyframes chw_lb_in{from{opacity: 0;transform: translateY(30px) scale(.98);}to{opacity: 1;transform: none;}}
.chw_lb_in{display: grid;grid-template-columns: minmax(0, auto) minmax(340px, 440px);max-height: inherit;}
.chw_lb figure{background: var(--color-dark);display: flex;align-items: center;justify-content: center;min-width: 0;min-height: 0;}
.hs_box .chw_lb figure img{display: block;width: auto;height: auto;max-width: 100%;max-height: 92vh;max-height: 92dvh;object-fit: contain;}
.chw_lb_txt{padding: clamp(28px, 3.5vw, 52px);overflow-y: auto;display: flex;flex-direction: column;min-height: 0;}
.hs_box .chw_lb_txt i{font-size: var(--f14);letter-spacing: .25em;color: var(--color-Sub);}
.hs_box .chw_lb_txt h3{font-family: var(--Seriffont);font-weight: 500;font-size: var(--f26);letter-spacing: .1em;line-height: 1.6;margin: 10px 0 22px;padding-right: 40px;}
.hs_box .chw_lb_txt p{white-space: pre-line;line-height: 2;}
.chw_lb_txt .ch_btn{align-self: flex-start;}
.chw_lb_txt .chw_lb_gap{flex: 1;min-height: 30px;}
.chw_lb_nav{display: flex;align-items: center;gap: 14px;margin-top: 30px;padding-top: 22px;border-top: 1px solid var(--color-line) !important;}
.hs_box .chw_lb_nav span{font-family: var(--Corfont);font-size: var(--f18);color: var(--colorText-sub);margin-right: auto;}
/* 橫圖：圖片在上，下方左欄標題、右欄說明 */
.chw_lb[data-orient="land"] .chw_lb_in{grid-template-columns: minmax(0, 1fr);grid-template-rows: auto auto;overflow-y: auto;}
.hs_box .chw_lb[data-orient="land"] figure img{width: 100%;max-height: 54vh;max-height: 54dvh;}
.chw_lb[data-orient="land"] .chw_lb_txt{display: grid;grid-template-rows: auto auto 1fr;overflow: visible;grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);column-gap: clamp(30px, 4vw, 60px);align-content: start;}
.chw_lb[data-orient="land"] .chw_lb_txt > i{grid-column: 1;grid-row: 1;}
.chw_lb[data-orient="land"] .chw_lb_txt > h3{grid-column: 1;grid-row: 2;}
.chw_lb[data-orient="land"] .chw_lb_txt > .ch_btn{grid-column: 1;grid-row: 3;align-self: start;justify-self: start;}
.chw_lb[data-orient="land"] .chw_lb_txt > p{grid-column: 2;grid-row: 1 / span 3;}
.chw_lb[data-orient="land"] .chw_lb_gap{display: none;}
.chw_lb[data-orient="land"] .chw_lb_nav{grid-column: 1 / -1;}
/* 關閉鈕放在框內右上角 */
.chw_lb_close{position: absolute;top: 14px;right: 14px;z-index: 2;width: 44px;height: 44px;border-radius: 50%;background: rgba(var(--rgb_dark),.55);border: 1px solid rgba(244,239,230,.55) !important;color: #fff;-webkit-backdrop-filter: blur(6px);backdrop-filter: blur(6px);cursor: pointer;display: grid;place-items: center;transition: background-color .3s, transform .5s var(--ease);}
.chw_lb_close:hover{background: var(--color-Sub);transform: rotate(90deg);}
.chw_lb_close svg{width: 18px;height: 18px;}
.chw_lb_more{display: none;}

/* --- Media Queries --- */
@media (max-width: 1440px) {
    .chw_grid{column-gap: 28px;}
}
@media (max-width: 1024px) {
    .chw_grid{columns: 2;}
}
@media (max-width: 992px) {
    body:has(.ch_header:not(.is-hidden).is-scrolled) .chw_filter{top: 64px;}
}
@media (max-width: 768px) {
    /* 燈箱（手機）：全黑看圖模式。照片為主角、左右滑動切換，文案收在「作品故事」 */
    .chw_lb{width: 100vw;max-width: 100vw;height: 100dvh;max-height: 100dvh;margin: 0;background: var(--color-dark2);overflow: hidden;}
    .chw_lb::backdrop{background: var(--color-dark2);}
    .chw_lb_in, .chw_lb[data-orient="land"] .chw_lb_in{display: grid;height: 100%;max-height: none;overflow: hidden;grid-template-columns: 1fr auto;grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;grid-template-areas: "nav nav" "fig fig" "cat cat" "title title" "more ig" "story story";padding-bottom: calc(18px + env(safe-area-inset-bottom));}
    .chw_lb_txt, .chw_lb[data-orient="land"] .chw_lb_txt{display: contents;}
    .chw_lb_nav{grid-area: nav;margin: 0;padding: 16px 70px 12px 20px;border: 0 !important;justify-content: flex-start;gap: 10px;}
    .hs_box .chw_lb_nav span{order: 2;margin: 0 6px;color: rgba(244,239,230,.75);font-size: var(--f16);letter-spacing: .1em;}
    .chw_lb_nav .ch_arw.prev{order: 1;}
    .chw_lb_nav .ch_arw.next{order: 3;}
    .chw_lb_nav .ch_arw{width: 36px;height: 36px;color: var(--colorText-whi);border-color: rgba(244,239,230,.3) !important;}
    .chw_lb_nav .ch_arw:disabled{color: var(--colorText-whi);}
    .chw_lb figure{grid-area: fig;background: transparent;padding: 0;touch-action: pan-y;}
    .hs_box .chw_lb figure img, .hs_box .chw_lb[data-orient="land"] figure img{width: 100%;height: 100%;max-height: none;object-fit: contain;transition: opacity .3s;}
    .hs_box .chw_lb_txt > i{grid-area: cat;padding: 18px 20px 0;}
    .hs_box .chw_lb_txt h3, .hs_box .chw_lb[data-orient="land"] .chw_lb_txt > h3{grid-area: title;margin: 4px 0 0;padding: 0 20px;font-size: var(--f20);color: var(--colorText-whi);}
    .chw_lb_more{grid-area: more;display: inline-flex;align-items: center;gap: 8px;justify-self: start;margin: 14px 0 0 20px;padding: 8px 0;background: none;cursor: pointer;}
    .hs_box .chw_lb_more span{font-size: var(--f15);letter-spacing: .15em;color: rgba(244,239,230,.85);}
    .chw_lb_more i{width: 8px;height: 8px;border-right: 1px solid var(--color-Sub);border-bottom: 1px solid var(--color-Sub);transform: rotate(45deg) translateY(-2px);transition: transform .4s var(--ease);}
    .chw_lb_more[aria-expanded="true"] i{transform: rotate(-135deg) translateY(-2px);}
    .chw_lb_txt .ch_btn, .chw_lb[data-orient="land"] .chw_lb_txt > .ch_btn{grid-area: ig;align-self: center;margin: 14px 20px 0 0;padding: 8px 16px;}
    .hs_box .chw_lb_txt .ch_btn span{font-size: var(--f14);letter-spacing: .1em;}
    .hs_box .chw_lb_txt p, .hs_box .chw_lb[data-orient="land"] .chw_lb_txt > p{grid-area: story;display: none;margin: 12px 20px 0;padding: 14px 0 0;border-top: 1px solid rgba(244,239,230,.14);max-height: 36dvh;overflow-y: auto;font-size: var(--f15);line-height: 1.9;color: rgba(244,239,230,.78);}
    .hs_box .chw_lb.is-story[data-orient] .chw_lb_txt > p{display: block;}
    .chw_lb_gap, .chw_lb[data-orient="land"] .chw_lb_gap{display: none;}
    /* 蓋過桌機橫圖版型的格線位置 */
    .hs_box .chw_lb[data-orient] .chw_lb_txt > i{grid-area: cat;}
    .hs_box .chw_lb[data-orient] .chw_lb_txt > h3{grid-area: title;}
    .hs_box .chw_lb[data-orient] .chw_lb_txt > .ch_btn{grid-area: ig;}
    .hs_box .chw_lb[data-orient] .chw_lb_txt > p{grid-area: story;scrollbar-width: thin;scrollbar-color: rgba(180,141,85,.5) transparent;}
    .hs_box .chw_lb[data-orient] .chw_lb_nav{grid-area: nav;}
    .hs_box .chw_lb[data-orient] .chw_lb_more{grid-area: more;}
    .chw_lb_close{top: 14px;right: 16px;width: 40px;height: 40px;background: transparent;border-color: rgba(244,239,230,.3) !important;}
    /* 分類：3×2 等寬方格，一次看到全部；數量置中顯示 */
    .chw_filter{position: static;flex-direction: column;align-items: stretch;gap: 14px;padding: 0;margin-bottom: 36px;border: 0 !important;}
    .chw_filter ul{display: grid;grid-template-columns: repeat(3, 1fr);gap: 8px;}
    .chw_filter button{width: 100%;display: flex;justify-content: center;align-items: baseline;padding: 11px 4px;border-radius: 0;border: 1px solid var(--color-line) !important;}
    .hs_box .chw_filter button span{font-size: var(--f14);letter-spacing: .1em;}
    .chw_count{text-align: center;}
    .chw_fab{display: flex;}
}
@media (max-width: 576px) {
    /* 作品牆：兩欄瀑布流 */
    .chw_grid{columns: 2;column-gap: 14px;}
    .chw_grid > li{margin-bottom: 28px;}
    .chw_grid .ch_work_txt{padding-top: 10px;gap: 0;}
    .hs_box .chw_grid .ch_work_txt i{font-size: 12px;letter-spacing: .12em;}
    .hs_box .chw_grid .ch_work_txt h3{font-size: var(--f15);letter-spacing: .05em;line-height: 1.55;}
    .chw_grid figure::after{display: none;}
}
@media (max-width: 480px) {
    .chw_filter button{padding: 10px 2px;white-space: nowrap;}
    .hs_box .chw_filter button span{letter-spacing: .04em;}
}
@media (max-width: 380px) {
    /* 分類：窄螢幕改兩欄，避免「活動・課程」折行 */
    .chw_filter ul, .chw_sheet_panel ul{grid-template-columns: repeat(2, 1fr);}
}
</style>
</head>
<body>

<script src="../js/chiu_layout.js" data-part="header"></script>

<div class="hs_box">
<main id="main">

    <section class="ch_banner" style="--bn_img:url(../image/chiu/w_fair.webp);--bn_pos:center 55%;--bn_img_m:url(../image/chiu/960/w_bridal.webp);--bn_pos_m:center 35%">
        <div class="ch_banner_bg"></div>
        <div class="ch_banner_in">
            <div data-animate-in="up">
                <div class="ch_en">Works</div>
                <h1>作品集</h1>
            </div>
            <ol class="ch_crumb" data-animate-in="up"><li><a href="index.html">首頁</a></li><li><span>作品</span></li></ol>
        </div>
    </section>

    <section class="chw_b" id="portfolio">
        <div class="chw_b01">
            <div class="chw_b01_head">
                <div class="ch_title" data-animate-in="left">
                    <div class="ch_en">Portfolio</div>
                    <h2>每一件作品，都是一段季節的光影</h2>
                </div>
                <p data-animate-in="up">從一束花禮到一整個空間，點選作品可查看創作故事。</p>
            </div>

            <div class="chw_filter">
                <ul aria-label="作品分類"></ul>
                <p class="chw_count" aria-live="polite">共 <b>23</b> 件作品</p>
            </div>

            <ul class="chw_grid" aria-busy="true"></ul>
            <nav class="chw_pager" aria-label="作品分頁" hidden></nav>
            <p class="chw_empty">這個分類目前沒有作品。</p>
        </div>

        <dialog class="chw_lb" aria-labelledby="chw_lb_title">
            <button class="chw_lb_close" type="button" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
            <div class="chw_lb_in">
                <figure><img src="" alt=""></figure>
                <div class="chw_lb_txt">
                    <i></i>
                    <h3 id="chw_lb_title"></h3>
                    <button class="chw_lb_more" type="button" aria-expanded="false" aria-controls="chw_lb_story"><span>作品故事</span><i></i></button>
                    <p id="chw_lb_story"></p>
                    <div class="chw_lb_gap"></div>
                    <a class="ch_btn" href="#" target="_blank" rel="noopener"><span>在 Instagram 查看</span><i></i></a>
                    <div class="chw_lb_nav">
                        <span></span>
                        <button class="ch_arw prev" type="button" aria-label="上一件作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
                        <button class="ch_arw next" type="button" aria-label="下一件作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
                    </div>
                </div>
            </div>
        </dialog>
    </section>

    <section class="ch_cta">
        <div class="ch_cta_bg" data-parallax="0.12"></div>
        <div class="ch_cta_in cen">
            <div class="ch_title cen whi" data-animate-in="down">
                <div class="ch_en">Let’s Create Together</div>
                <h2>喜歡這樣的風格嗎？</h2>
            </div>
            <p data-animate-in="up">告訴我們你的場合與想法，為你量身規劃。</p>
            <div class="ch_btns" data-animate-in="up">
                <a class="ch_btn fill" href="contact.html"><span>預約諮詢</span><i></i></a>
                <a class="ch_btn" href="https://www.instagram.com/chiu.florist/" target="_blank" rel="noopener"><span>更多作品在 IG</span><i></i></a>
            </div>
        </div>
    </section>

</main>

<script src="../js/chiu_layout.js" data-part="footer"></script>
</div>

<script src="../js/scrollfade.js"></script>
<script src="../js/chiu_common.js"></script>
<script>
    /* 作品頁邏輯：篩選、分頁、燈箱、手機篩選面板（資料載入後執行） */
    function chwInit() {
        var grid = document.querySelector('.chw_grid');
        var items = [].slice.call(grid.children);
        var btns = [].slice.call(document.querySelectorAll('.chw_filter button'));
        var countEl = document.querySelector('.chw_count b');
        var empty = document.querySelector('.chw_empty');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* 各分類數量 */
        btns.forEach(function (b) {
            var f = b.getAttribute('data-filter');
            b.querySelector('sup').textContent = f === 'all' ? items.length : items.filter(function (li) { return li.getAttribute('data-cat') === f; }).length;
        });

        function visible() { return items.filter(function (li) { return !li.classList.contains('is-hide'); }); }

        var PER = 12, curFilter = 'all', curPage = 1;
        var pager = document.querySelector('.chw_pager');
        var arwL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
        var arwR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

        function apply(f, push, page) {
            if (!btns.some(function (b) { return b.getAttribute('data-filter') === f; })) f = 'all';
            btns.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-filter') === f); });
            var list = items.filter(function (li) { return f === 'all' || li.getAttribute('data-cat') === f; });
            var pages = Math.max(1, Math.ceil(list.length / PER));
            page = Math.min(Math.max(parseInt(page, 10) || 1, 1), pages);
            curFilter = f; curPage = page;
            var n = 0;
            items.forEach(function (li) {
                var idx = list.indexOf(li);
                var inFilter = idx > -1, onPage = inFilter && Math.floor(idx / PER) === page - 1;
                li.classList.toggle('is-hide', !inFilter);   /* 不在分類：燈箱也略過 */
                li.classList.toggle('is-off', inFilter && !onPage);   /* 在分類但不在本頁：燈箱仍可瀏覽 */
                li.classList.remove('is-enter');
                if (onPage && !reduce) { void li.offsetWidth; li.style.setProperty('--n', n++); li.classList.add('is-enter'); }
            });
            grid.classList.toggle('is-filtered', f !== 'all');
            countEl.textContent = list.length;
            empty.style.display = list.length ? 'none' : 'block';
            renderPager(pages);
            if (push) {
                var url = new URL(location.href);
                if (f === 'all') url.searchParams.delete('cat'); else url.searchParams.set('cat', f);
                if (page > 1) url.searchParams.set('page', page); else url.searchParams.delete('page');
                history.replaceState(null, '', url);
            }
            if (window.sfCheck) window.sfCheck();
        }

        function renderPager(pages) {
            pager.innerHTML = '';
            pager.hidden = pages < 2;
            if (pages < 2) return;
            function btn(html, p, label, cls, disabled, current) {
                var b = document.createElement('button');
                b.type = 'button'; b.innerHTML = html; b.className = cls || '';
                b.setAttribute('aria-label', label);
                if (current) b.setAttribute('aria-current', 'page');
                if (disabled) b.disabled = true;
                else b.addEventListener('click', function () { goPage(p); });
                pager.appendChild(b);
            }
            btn(arwL, curPage - 1, '上一頁', 'chw_pg_arw', curPage === 1);
            for (var p = 1; p <= pages; p++) btn(String(p).padStart(2, '0'), p, '第 ' + p + ' 頁', '', false, p === curPage);
            btn(arwR, curPage + 1, '下一頁', 'chw_pg_arw', curPage === pages);
        }

        function goPage(p) {
            apply(curFilter, true, p);
            window.scrollTo({ top: grid.getBoundingClientRect().top + window.scrollY - 120, behavior: reduce ? 'auto' : 'smooth' });
        }
        btns.forEach(function (b) { b.addEventListener('click', function () { apply(b.getAttribute('data-filter'), true); }); });
        /* 從其他頁帶 #portfolio 進來：略過大 Banner，直接停在作品列表 */
        if (location.hash === "#portfolio") {
            var jump = function () { var t = document.getElementById("portfolio"); if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY, behavior: "auto" }); };
            jump(); window.addEventListener("load", jump);
        }
        var u0 = new URL(location.href);
        apply(u0.searchParams.get("cat") || "all", false, u0.searchParams.get("page"));

        /* 手機：浮動篩選鈕＋底部面板 */
        var fab = document.createElement("button");
        fab.type = "button"; fab.className = "chw_fab"; fab.setAttribute("aria-haspopup", "dialog");
        fab.innerHTML = "<span>篩選</span><b></b><i aria-hidden=\"true\"></i>";
        var sheet = document.createElement("div");
        sheet.className = "chw_sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "作品分類");
        sheet.innerHTML = "<button class=\"chw_sheet_bg\" type=\"button\" aria-label=\"關閉\"></button><div class=\"chw_sheet_panel\"><p>Categories</p><ul></ul></div>";
        var sheetBtns = btns.map(function (b) {
            var c = document.createElement("button");
            c.type = "button"; c.innerHTML = b.innerHTML; c.setAttribute("data-filter", b.getAttribute("data-filter"));
            c.addEventListener("click", function () {
                apply(c.getAttribute("data-filter"), true); closeSheet();
                window.scrollTo({ top: grid.getBoundingClientRect().top + window.scrollY - 100, behavior: reduce ? "auto" : "smooth" });
            });
            var li = document.createElement("li"); li.appendChild(c); sheet.querySelector("ul").appendChild(li);
            return c;
        });
        document.body.appendChild(fab); document.body.appendChild(sheet);
        function openSheet() { sheet.classList.add("is-open"); var on = sheet.querySelector("[aria-pressed=true]"); setTimeout(function () { (on || sheetBtns[0]).focus(); }, 100); }
        function closeSheet() { sheet.classList.remove("is-open"); }
        fab.addEventListener("click", openSheet);
        sheet.querySelector(".chw_sheet_bg").addEventListener("click", closeSheet);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet.classList.contains("is-open")) { closeSheet(); fab.focus(); } });
        function syncFab() {
            var cur = btns.filter(function (b) { return b.getAttribute("aria-pressed") === "true"; })[0];
            fab.querySelector("b").textContent = cur ? cur.querySelector("span").textContent : "全部";
            sheetBtns.forEach(function (c) { c.setAttribute("aria-pressed", c.getAttribute("data-filter") === (cur && cur.getAttribute("data-filter"))); });
        }
        var filterBar = document.querySelector(".chw_filter");
        function fabVisible() {
            var fr = filterBar.getBoundingClientRect(), gr = grid.getBoundingClientRect();
            fab.classList.toggle("is-show", fr.bottom < 0 && gr.bottom > window.innerHeight * 0.6);
        }
        window.addEventListener("scroll", fabVisible, { passive: true });
        btns.forEach(function (b) { b.addEventListener("click", syncFab); });
        sheetBtns.forEach(function (c) { c.addEventListener("click", syncFab); });
        syncFab(); fabVisible();

        /* 燈箱 */
        var lb = document.querySelector('.chw_lb');
        var lbImg = lb.querySelector('figure img');
        var lbCat = lb.querySelector('.chw_lb_txt > i');
        var lbTitle = lb.querySelector('.chw_lb_txt h3');
        var lbText = lb.querySelector('.chw_lb_txt p');
        var lbIg = lb.querySelector('.chw_lb_txt .ch_btn');
        var lbIdx = lb.querySelector('.chw_lb_nav span');
        var list = [], cur = 0;

        function fill() {
            var li = list[cur];
            lbImg.src = li.querySelector('img').getAttribute('src');
            lbImg.alt = li.querySelector('img').getAttribute('alt') || '';
            var im = li.querySelector("img");
            lb.setAttribute("data-orient", (+im.getAttribute("width") >= +im.getAttribute("height") * 1.15) ? "land" : "port");
            lbCat.textContent = li.querySelector('.ch_work_txt i').textContent;
            lbTitle.textContent = li.querySelector('h3').textContent;
            if (window.chSegment) window.chSegment(lbTitle);
            lbText.textContent = li.querySelector('template').content.textContent.trim();
            var ig = li.getAttribute('data-ig');
            lbIg.href = ig ? 'https://www.instagram.com/p/' + ig + '/' : 'https://www.instagram.com/chiu.florist/';
            lbIdx.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0');
        }
        items.forEach(function (li) {
            li.querySelector('button').addEventListener('click', function () {
                list = visible(); cur = list.indexOf(li); fill();
                lb.classList.remove("is-story"); more.setAttribute("aria-expanded", "false");
                lb.showModal();
            });
        });
        function move(d) { cur = (cur + d + list.length) % list.length; fill(); }
        lb.querySelector('.prev').addEventListener('click', function () { move(-1); });
        lb.querySelector('.next').addEventListener('click', function () { move(1); });
        /* 手機：作品故事展開、左右滑動切換 */
        var more = lb.querySelector(".chw_lb_more");
        more.addEventListener("click", function () { var on = !lb.classList.contains("is-story"); lb.classList.toggle("is-story", on); more.setAttribute("aria-expanded", on); });
        var fig = lb.querySelector("figure"), tx = 0, ty = 0;
        fig.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
        fig.addEventListener("touchend", function (e) { var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1); }, { passive: true });
        lb.querySelector('.chw_lb_close').addEventListener('click', function () { lb.close(); });
        lb.addEventListener('click', function (e) { if (e.target === lb) lb.close(); });
        lb.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') move(-1);
            if (e.key === 'ArrowRight') move(1);
        });
    }

    /* 讀取 data/works.json，產生分類按鈕與作品卡（之後改作品只要改 JSON） */
    (function () {
        var grid = document.querySelector('.chw_grid');
        var filterUl = document.querySelector('.chw_filter ul');
        var empty = document.querySelector('.chw_empty');
        /* 響應式圖片：依原圖寬度提供 480／960 縮圖（data/works.json 的 width 要填原圖寬） */
        function rs(w, sizes) {
            var n = String(w.image).replace(/\.webp$/, ''), W = +w.width || 0, s = [];
            if (W > 552) s.push('../image/chiu/480/' + n + '.webp 480w');
            if (W > 1104) s.push('../image/chiu/960/' + n + '.webp 960w');
            if (!s.length) return '';
            s.push('../image/chiu/' + n + '.webp ' + W + 'w');
            return ' srcset="' + s.join(', ') + '" sizes="' + sizes + '" onerror="this.onerror=null;this.removeAttribute(\x27srcset\x27)"';
        }

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        fetch('../data/works.json', { cache: 'no-cache' })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (data) {
                filterUl.innerHTML = '<li><button type="button" data-filter="all" aria-pressed="true"><span>全部</span><sup></sup></button></li>' +
                    data.categories.map(function (c) {
                        return '<li><button type="button" data-filter="' + esc(c.id) + '" aria-pressed="false"><span>' + esc(c.name) + '</span><sup></sup></button></li>';
                    }).join('');
                grid.innerHTML = data.works.map(function (w) {
                    return '<li class="ch_work" data-cat="' + esc(w.category) + '" data-ig="' + esc(w.instagram) + '">' +
                        '<button type="button" data-cursor="View"><figure><img src="../image/chiu/' + esc(w.image) + '"' + rs(w, '(max-width: 768px) 50vw, 33vw') + ' alt="' + esc(w.label + '｜' + w.title) + '" width="' + (+w.width || '') + '" height="' + (+w.height || '') + '" loading="lazy"></figure>' +
                        '<div class="ch_work_txt"><i>' + esc(w.label) + '</i><h3>' + esc(w.title) + '</h3></div></button>' +
                        '<template>' + esc(w.story) + '</template></li>';
                }).join('');
                grid.removeAttribute('aria-busy');
                [].forEach.call(grid.querySelectorAll('h3'), function (h) { if (window.chSegment) window.chSegment(h); });
                chwInit();
            })
            .catch(function () {
                grid.removeAttribute('aria-busy');
                empty.textContent = '作品資料載入失敗，請重新整理頁面。';
                empty.style.display = 'block';
            });
    })();
</script>
